[build]
target = "thumbv8m.main-none-eabihf"

[target.thumbv8m.main-none-eabihf]
# elf2uf2-rs does not produce a working UF2 for RP235x (embassy-rs/embassy#4322);
# picotool is the working alternative for BOOTSEL-mode flashing without a debug probe.
runner = "picotool load -u -v -x -t elf"
linker = "flip-link"
